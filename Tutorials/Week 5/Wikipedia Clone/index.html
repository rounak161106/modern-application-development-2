<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Clone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>  
    <style>
        .result{
            width: fit-content;
            max-width: 40%;
            padding: 8px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <h1>Wikipedia Clone</h1>
    <div id="app">
        <label for="query">Enter any topic name : </label>
        <input type="text" id="query" v-model="query">
        <button @click="fetch"><i class="bi bi-search"></i></button>
        <div class="result" v-if="result">
            <b>Result</b> : {{ result }}
            <span><a href="#" @click="show_full">{{ qty }}</a></button></span>
        </div>
    </div>
    <script src="script.js"></script>
</html>
