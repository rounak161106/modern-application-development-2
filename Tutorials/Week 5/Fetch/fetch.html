        // Sending POST request
        function send_data(data){
            fetch('http://127.0.0.1:5000/submit', {
                method : 'POST', 
                headers : {
                   'Content-Type' : 'application/json'  // here instead of defining headers again and again, we can create Header object and assign value to it and reuse again and again.
                },
                body : JSON.stringify(data)            // we can send form data, upload files and many more. for form, header and stringify is not required as it is done by default by the browser.
            })
            .then(resp => resp.json())
            .then(d => console.log("Received data successfully"))
            .catch(e => console.log("unexpected error"))
        }
        send_data({"name" : "Rounak", "age" : 20})
