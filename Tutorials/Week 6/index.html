<!-- now we are introduced to routes. Vue and routes are two different entities and they are connected using cdn in order to work together.
 when we try to navigate to different routes, there won't be any page reload and we are just redirected to that particular component without any page reload.
 Normally for static websites, if we click on a endpoint, there is a full page reload, but here that's not the case.
 
 Navigation in software terms, refers to moving from one page to another without reloading the entire page. In traditional websites, we have to reload the entire page but this is SPA, where the page, background, eg. navbar, will be same, just the content will be replaced without reloading the entire page.
 
 A component is a reuable piece of ui-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://unpkg.com/vue-router@3/dist/vue-router.js"></script>
</head>
<body>
    <div id="app">
        <h3>{{ message }}</h3>
        <!-- <home>This is the Home Page</home>
        <about>This is the   About Page</about> -->
        <router-link to="/home">Home</router-link>
        <router-link to="/about">About</router-link>
        <router-view></router-view> 
    </div>
    <script>
        const home = {
            template : `
                <div>
                    <p>Home page</p>
                </div> 
            `
        }
        const about = {
            template : `
                <div>
                    <p>About page</p>
                </div> 
            `
        }
        const routes = [
            { path : "/home", component : home },
            { path : "/about", component : about }
        ]
        const router = new VueRouter({
            routes
        })
        const app = new Vue({
            el : "#app", 
            data : {
                message : "Hello World"
            },
            components : {
                home, 
                about
            },
            router, 
            mounted(){
                // this.$router.push("/home")  // this will redirect to home page when the page is loaded. we can also use this.$router.push("/about") to redirect to about page.
            }
        })
    </script>
</body>
</html>
